<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Որդերի Գոտի - Worms Zone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- LOBBY BACKGROUND & INTERACTIVE WORM CANVAS -->
<canvas id="lobbyCanvas"></canvas>

<!-- LOBBY FOREGROUND UI -->
<div id="lobbyScreen">
  <!-- Top Left: Profile -->
  <div class="top-left-bar">
    <div class="avatar-box ui-btn" id="openProfileBtn">
      <span id="lobbyAvatar">🐛</span>
      <div class="level-badge" id="lobbyLevel">1</div>
    </div>
    <div class="profile-info">
      <div class="xp-bar-wrap">
        <div class="xp-bar-fill" id="lobbyXpFill"></div>
        <div class="xp-text" id="lobbyXpText">35 / 100 XP</div>
      </div>
      <button class="player-name-btn ui-btn" id="lobbyNameBtn">Սամվել</button>
    </div>
  </div>

  <!-- Top Right: Coins & Language -->
  <div class="top-right-bar">
    <div class="coin-pill">
      <span class="coin-icon">🪙</span>
      <span class="coin-val" id="lobbyCoins">250</span>
      <button class="plus-btn ui-btn" id="addFreeCoinsBtn">+</button>
    </div>
    <button class="lang-btn ui-btn" id="langToggleBtn">ՀԱՅ</button>
  </div>

  <!-- Right Vertical Promo Banners -->
  <div class="right-promos">
    <button class="promo-card ui-btn" data-promo="starter">
      <span class="promo-emoji">🦸‍♂️</span>
      <span class="promo-timer" id="timer1">3օ 11ժ</span>
    </button>
    <button class="promo-card gold ui-btn" data-promo="chest">
      <span class="promo-emoji">🎁</span>
      <span class="promo-timer" data-promo-free="1" id="freeGiftLabel">ԱՆՎՃԱՐ</span>
    </button>
    <button class="promo-card pink ui-btn" data-promo="piggy">
      <span class="promo-emoji">🐷</span>
      <span class="promo-timer" id="timer2">23ժ 30ր</span>
    </button>
  </div>

  <!-- Center Logo -->
  <div class="center-logo">
    <div class="logo-title">WORMS</div>
    <div class="logo-sub" id="logoSubText">ՈՐԴԵՐԻ ԳՈՏԻ</div>
  </div>

  <!-- Bottom Center Main Play & Workshop -->
  <div class="bottom-center-controls">
    <button class="play-main-btn ui-btn" id="startGameBtn">ՄԱՐՏԻ՛</button>
    <button class="workshop-btn ui-btn" id="openShopBtn">Արհեստանոց</button>
    <div class="hint-caption" id="lobbyHintText">Սեղմիր ցանկացած տեղ կամ բռնիր որդիկին</div>
  </div>

  <!-- Bottom Left Tools -->
  <div class="bottom-left-tools">
    <button class="square-tool-btn ui-btn" id="openRecordsBtn" title="Ռեկորդներ">🏆</button>
    <button class="square-tool-btn ui-btn" id="fullscreenLobbyBtn" title="Ամբողջ էկրան">⛶</button>
  </div>

  <!-- Bottom Right Tools -->
  <div class="bottom-right-tools">
    <button class="square-tool-btn orange ui-btn" id="openSettingsBtn" title="Կարգավորումներ">⚙️</button>
  </div>
</div>

<!-- MODAL: SHOP / WORKSHOP -->
<div class="modal-backdrop" id="shopModal">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-title" id="shopModalTitle">Արհեստանոց</div>
      <button class="close-modal-btn ui-btn" data-close="shopModal">✕</button>
    </div>
    <div class="modal-body">
      <div class="skins-grid" id="skinsGrid"></div>
    </div>
  </div>
</div>

<!-- MODAL: PROFILE -->
<div class="modal-backdrop" id="profileModal">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-title" id="profileModalTitle">Իմ Պրոֆիլը</div>
      <button class="close-modal-btn ui-btn" data-close="profileModal">✕</button>
    </div>
    <div class="modal-body">
      <label id="nameLabel" style="font-weight:800;font-size:14px;">Խաղացողի անունը</label>
      <input type="text" id="playerNameInput" class="input-field" maxlength="16">
      <label id="avatarLabel" style="font-weight:800;font-size:14px;">Ընտրիր ավատար</label>
      <div class="avatar-picker" id="avatarPicker"></div>
      <button class="play-main-btn ui-btn" id="saveProfileBtn" style="font-size:18px;padding:10px;">Պահպանել</button>
    </div>
  </div>
</div>

<!-- MODAL: SETTINGS -->
<div class="modal-backdrop" id="settingsModal">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-title" id="settingsModalTitle">Կարգավորումներ</div>
      <button class="close-modal-btn ui-btn" data-close="settingsModal">✕</button>
    </div>
    <div class="modal-body">
      <div class="setting-row">
        <span id="soundSettingLabel" style="font-weight:800;">Ձայն և Երաժշտություն</span>
        <button class="hud-mini-btn" id="toggleSoundSettingBtn">🔊 Միացված</button>
      </div>
      <div class="setting-row">
        <span id="langSettingLabel" style="font-weight:800;">Լեզու / Language</span>
        <button class="hud-mini-btn" id="cycleLangSettingBtn">Հայերեն</button>
      </div>
      <div class="setting-row">
        <span id="fsSettingLabel" style="font-weight:800;">Ամբողջ էկրան</span>
        <button class="hud-mini-btn" id="fsSettingBtn">⛶ Բացել</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL: PROMO / RECORDS -->
<div class="modal-backdrop" id="infoModal">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-title" id="infoModalTitle">Ակցիա</div>
      <button class="close-modal-btn ui-btn" data-close="infoModal">✕</button>
    </div>
    <div class="modal-body" id="infoModalBody" style="text-align:center;"></div>
  </div>
</div>

<!-- IN-GAME CONTAINER -->
<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>

  <div class="hud-top-left">
    <div><span id="hudScoreLabel">Միավոր</span>: <span id="scoreVal" style="color:#ffd166;">10</span></div>
    <div><span id="hudCoinsLabel">Մետաղադրամ</span>: <span id="gameCoinsVal" style="color:#80ed99;">250</span> 🪙</div>
  </div>

  <div id="activeEffects"></div>
  <div id="shieldNotice">⚠️ Պաշտպանությունն ավարտվեց!</div>
  <div id="killToastContainer"></div>

  <div class="hud-top-right">
    <div class="hud-btns">
      <button class="hud-mini-btn" id="gameSoundBtn">🔊</button>
      <button class="hud-mini-btn" id="gameFsBtn">⛶</button>
      <button class="hud-mini-btn" id="exitToLobbyBtn">🏠</button>
    </div>
    <div class="leaderboard-box">
      <div class="lb-title" id="lbTitleText">ԱՌԱՋԱՏԱՐՆԵՐ</div>
      <div id="leaderboardList"></div>
    </div>
  </div>

  <button id="boostBtn">ԱՐԱԳ</button>
</div>

<!-- GAME OVER SCREEN -->
<div id="gameOverScreen">
  <div class="go-card">
    <h2 id="goTitle" style="color:#ff6b6b;font-size:28px;">Խաղն ավարտվեց</h2>
    <div style="font-size:18px;font-weight:800;">
      <span id="goScoreLabel">Քո միավորները</span>: <span id="finalScore" style="color:#ffd166;">0</span>
    </div>
    <div style="font-size:15px;color:#80ed99;font-weight:700;" id="goRewardText">+25 🪙 | +40 XP</div>
    <button class="play-main-btn ui-btn" id="playAgainBtn" style="font-size:20px;padding:12px;">ՆՈՐԻՑ ԽԱՂԱԼ</button>
    <button class="workshop-btn ui-btn" id="goLobbyBtn">Գլխավոր էջ</button>
  </div>
</div>

    
    <script src="i18n.js"></script>
    <script src="lobby.js"></script>
    <script src="engine.js"></script>
    <script src="gameLoop.js"></script>
</body>
</html>
